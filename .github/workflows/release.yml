name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller ELK-BLEDOM.spec

      - name: Determine Release Metadata
        id: vars
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          CLEAN_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Release ${TAG}"
          else
            TAG="build-${{ github.run_number }}-${SHORT_SHA}"
            TITLE="Build #${{ github.run_number }}: ${CLEAN_MSG}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "clean_msg=${CLEAN_MSG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body: |
            ### 📝 Changelog / Información del Commit
            - **Commit:** [`${{ steps.vars.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Mensaje:** ${{ steps.vars.outputs.clean_msg }}
            - **Autor:** ${{ github.event.head_commit.author.name }}

            ### 📦 Descarga
            Descarga el archivo adjunto **`ELK-BLEDOM.exe`** y ejecútalo directamente en Windows 10/11 (no requiere tener Python instalado).
          files: dist/ELK-BLEDOM.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
